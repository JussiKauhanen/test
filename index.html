<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Beep · Listen / Send</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         margin: 0; padding: 24px; display: flex; flex-direction: column; gap: 16px;
         align-items: center; justify-content: center; min-height: 100dvh; text-align: center; }
  h1 { font-size: 20px; margin: 0; font-weight: 600; }
  .row { display: flex; gap: 12px; }
  button { font-size: 18px; padding: 18px 28px; border-radius: 14px; border: 1px solid #8888;
           background: #8881; cursor: pointer; min-width: 130px; -webkit-tap-highlight-color: transparent; }
  button.on { background: #2e7d32; color: #fff; border-color: #2e7d32; }
  button:disabled { opacity: .45; }
  #status { min-height: 2.4em; opacity: .8; max-width: 30ch; }
  #meter { width: min(90vw,340px); height: 10px; background: #8883; border-radius: 5px; overflow: hidden; }
  #bar { height: 100%; width: 0%; background: #2e7d32; transition: width .05s; }
  small { opacity: .55; max-width: 34ch; }
</style>
</head>
<body>

<h1>Beep · Listen / Send</h1>

<div class="row">
  <button id="listenBtn">🎧 Listen</button>
  <button id="sendBtn">📣 Send</button>
</div>

<div id="meter"><div id="bar"></div></div>
<div id="status">Pick a mode. One device sends, the other listens.</div>
<small>Needs HTTPS (or localhost) for the microphone. Turn the sender's volume up and keep the devices a metre or two apart.</small>

<script>
(() => {
  "use strict";

  const FREQ = 1800;          // beep tone (Hz) — above speech, easy to hear
  const BEEP_MS = 160;        // length of each beep
  const GAP_MS  = 120;        // gap between the two beeps
  const PERIOD  = 3000;       // send every 3 s
  const RATIO   = 8;          // detection: target bin must be N× the spectrum median
  const COOLDOWN = 2500;      // ms of silence after a detection

  const listenBtn = document.getElementById("listenBtn");
  const sendBtn   = document.getElementById("sendBtn");
  const statusEl  = document.getElementById("status");
  const bar       = document.getElementById("bar");

  let ctx = null, mode = null, sendTimer = null;
  let stream = null, analyser = null, rafId = null, lastHit = 0, spoke = false;

  const say = (t) => statusEl.textContent = t;

  function audio() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }

  // iOS needs speech to be unlocked by a user gesture — prime it on the first tap.
  function primeSpeech() {
    if (spoke || !("speechSynthesis" in window)) return;
    const u = new SpeechSynthesisUtterance(" ");
    u.volume = 0; speechSynthesis.speak(u); spoke = true;
  }

  function speakOk() {
    if ("speechSynthesis" in window) {
      const u = new SpeechSynthesisUtterance("OK");
      u.rate = 1; u.volume = 1;
      speechSynthesis.cancel(); speechSynthesis.speak(u);
    }
  }

  /* ---------- SEND ---------- */
  function beep(at) {
    const c = audio();
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = "sine"; osc.frequency.value = FREQ;
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(0.5, at + 0.01);
    g.gain.setValueAtTime(0.5, at + BEEP_MS / 1000 - 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, at + BEEP_MS / 1000);
    osc.connect(g).connect(c.destination);
    osc.start(at); osc.stop(at + BEEP_MS / 1000 + 0.02);
  }

  function burst() {
    const t = audio().currentTime + 0.05;
    beep(t);
    beep(t + (BEEP_MS + GAP_MS) / 1000);
    say("Sent a beep · " + new Date().toLocaleTimeString());
  }

  /* ---------- LISTEN ---------- */
  async function startListening() {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });
    const c = audio();
    analyser = c.createAnalyser();
    analyser.fftSize = 2048;
    analyser.smoothingTimeConstant = 0;
    c.createMediaStreamSource(stream).connect(analyser);

    const bins = new Float32Array(analyser.frequencyBinCount);
    const binHz = c.sampleRate / analyser.fftSize;
    const target = Math.round(FREQ / binHz);

    say("Listening for a beep…");

    (function loop() {
      rafId = requestAnimationFrame(loop);
      analyser.getFloatFrequencyData(bins);

      let peak = -Infinity;
      for (let i = target - 2; i <= target + 2; i++) peak = Math.max(peak, bins[i]);

      // median-ish noise floor
      const sorted = Array.prototype.slice.call(bins).sort((a, b) => a - b);
      const floor = sorted[sorted.length >> 1];

      const dbOver = peak - floor;                    // dB above the noise floor
      bar.style.width = Math.max(0, Math.min(100, dbOver * 2)) + "%";

      const now = performance.now();
      if (dbOver > 20 * Math.log10(RATIO) && now - lastHit > COOLDOWN) {
        lastHit = now;
        speakOk();
        say('Heard a beep — said "OK" · ' + new Date().toLocaleTimeString());
      }
    })();
  }

  function stopAll() {
    clearInterval(sendTimer); sendTimer = null;
    cancelAnimationFrame(rafId); rafId = null;
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    analyser = null; bar.style.width = "0%";
    listenBtn.classList.remove("on"); sendBtn.classList.remove("on");
  }

  /* ---------- UI ---------- */
  listenBtn.onclick = async () => {
    primeSpeech();
    if (mode === "listen") { mode = null; stopAll(); return say("Stopped."); }
    stopAll(); mode = "listen"; listenBtn.classList.add("on");
    try { await startListening(); }
    catch (e) { mode = null; stopAll(); say("Mic blocked: " + e.message + " (needs HTTPS + permission)"); }
  };

  sendBtn.onclick = () => {
    primeSpeech();
    if (mode === "send") { mode = null; stopAll(); return say("Stopped."); }
    stopAll(); mode = "send"; sendBtn.classList.add("on");
    audio(); burst();
    sendTimer = setInterval(burst, PERIOD);
  };

  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && ctx && ctx.state === "suspended") ctx.resume();
  });
})();
</script>
</body>
</html>
